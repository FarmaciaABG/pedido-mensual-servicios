<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar pedido</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#dfe5ee;--brand:#1f5b8f;--brand2:#0f416d;--soft:#eaf3fb;--warn:#fff5cc;--warnb:#d6a600;--danger:#fde8e8;--dangerb:#d64545;--ok:#e8f7ec;--okb:#2f8f4e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;padding:18px 26px}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
.shell{max-width:1450px;margin:auto;padding:24px}.card,.meta,.metric{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(24,39,75,.05)}.card{padding:18px;margin-bottom:18px}
.topbar{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;margin-bottom:18px}.meta,.metric{padding:14px 16px}.meta b,.metric b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.meta span{font-weight:700}.metric strong{font-size:24px}
input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #cfd7e3;border-radius:9px;padding:9px 10px;background:white;color:var(--text)}input[type=number]{width:105px}textarea{width:100%;min-height:74px}
button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700;background:var(--brand);color:#fff;text-decoration:none;display:inline-block}.secondary{background:#eef2f7;color:#23324b}.ghost{background:#fff;border:1px solid var(--line);color:#23324b}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th{position:sticky;top:0;background:#edf3f8;color:#334155;text-align:left;padding:10px;border-bottom:1px solid var(--line);z-index:1}td{padding:9px 10px;border-bottom:1px solid #edf0f4;vertical-align:top}tbody tr:hover{background:#fafcff}.table-wrap{max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.small{font-size:12px;color:var(--muted)}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.ok{background:var(--ok);color:#246d3a}.warnTag{background:var(--warn);color:#7a5a00}.muted{background:#eef2f7;color:#586275}.sent{background:#e8f2fb;color:#225f8e}.review{background:#fff3d1;color:#7c5c00}.closed{background:#e7f6ec;color:#277242}
.alert{margin-top:7px;padding:8px 10px;border-radius:8px;font-size:12px}.alert.warn{background:var(--warn);border-left:4px solid var(--warnb)}.alert.info{background:var(--soft);border-left:4px solid var(--brand)}.alert.danger{background:var(--danger);border-left:4px solid var(--dangerb)}
.filters,.toolbar,.footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:7px 11px;border-radius:999px;background:#eef2f7;color:#314158;font-size:12px;font-weight:700;cursor:pointer}.pill.active{background:var(--brand);color:#fff}.footer{justify-content:flex-end;margin-top:16px}
.hidden{display:none!important}.grid4{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px}.box{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fafcff}.box b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.login{max-width:500px;margin:48px auto}.status{padding:10px 12px;border-radius:10px;margin:10px 0;background:var(--ok)}.late{background:var(--warn)}
@media(max-width:900px){.topbar,.grid4{grid-template-columns:1fr 1fr}.table-wrap{max-height:none}}@media(max-width:600px){.topbar,.grid4{grid-template-columns:1fr}}
@media print{header,.no-print{display:none!important}.shell{padding:0}.card{box-shadow:none;border:0}}
.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service-btn{background:white;color:#23324b;border:1px solid var(--line);padding:14px;text-align:left}.service-btn:hover{border-color:var(--brand);background:#f7fbff}@media(max-width:700px){.service-grid{grid-template-columns:1fr}}</style></head>
<body><header><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Solicitar pedido</h1><p>Pedido mensual de servicios</p></div><a class="btn secondary" href="index.html">Volver</a></div></header>
<div class="shell">
<section id="stepService" class="card" style="max-width:900px;margin:24px auto"><h2>Seleccione el servicio</h2><p class="small">Seleccione desde qué servicio realizará el pedido.</p><div class="service-grid" style="margin-top:14px"><button class="service-btn" data-service="Esterilización">Esterilización</button><button class="service-btn" data-service="Vacunatorio">Vacunatorio</button><button class="service-btn" data-service="Sector 2">Sector 2</button><button class="service-btn" data-service="Sector 3">Sector 3</button><button class="service-btn" data-service="Apósitos EU CECOSF MH">Apósitos EU CECOSF MH</button><button class="service-btn" data-service="Tratamiento">Tratamiento</button><button class="service-btn" data-service="REA">REA</button><button class="service-btn" data-service="Sala RIA">Sala RIA</button><button class="service-btn" data-service="Dental">Dental</button><button class="service-btn" data-service="PADDS">PADDS</button><button class="service-btn" data-service="Podólogas">Podólogas</button><button class="service-btn" data-service="Salas Respiratorias">Salas Respiratorias</button><button class="service-btn" data-service="Equipo de Servicio">Equipo de Servicio</button></div></section>
<section id="stepName" class="card hidden" style="max-width:620px;margin:24px auto"><h2 id="selectedServiceTitle"></h2><p class="small">Ingrese el nombre de quien está realizando este pedido.</p><label>Nombre y apellido</label><input id="requesterName" type="text" placeholder="Ej.: María Pérez" style="width:100%;margin:6px 0 14px"><div id="nameMsg"></div><div class="footer"><button class="secondary" id="backService">Volver</button><button id="continueBtn">Continuar</button></div></section>
<section id="alreadySent" class="card hidden" style="max-width:700px;margin:24px auto"><h2>Pedido ya enviado</h2><div class="alert info" id="sentInfo"></div><div class="footer"><a class="btn secondary" href="index.html">Volver al inicio</a></div></section>
</div>

};</script><script>const STORAGE_KEY = "pedido_servicios_abg_v1";
const SESSION_KEY = "pedido_servicios_abg_session";

function loadDB(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw) return JSON.parse(raw);
  const db = {
    orders: [],
    responsables: APP_DATA.services.map(s=>({service:s,principal:"",email:"",substitute:"",substituteEmail:"",active:true})),
    periods: APP_DATA.periods,
    mailConfig: APP_DATA.emailDefaults
  };
  saveDB(db);
  return db;
}
function saveDB(db){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
function getSession(){ const s = sessionStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }
function setSession(u){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(u)); }
function logout(){ sessionStorage.removeItem(SESSION_KEY); location.href="index.html"; }

function requireRole(role){
  const s=getSession();
  if(!s){ location.href="index.html"; return null; }
  if(role && s.role!==role){ location.href=s.role==="pharmacy"?"farmacia.html":"pedido.html"; return null; }
  return s;
}
function nowCL(){
  return new Date().toLocaleString("es-CL");
}
function todayISO(){
  const d=new Date(); return d.toISOString().slice(0,10);
}
function getCurrentPeriod(){
  const today = todayISO();
  let p = APP_DATA.periods.find(x=>today<=x.close);
  return p || APP_DATA.periods[APP_DATA.periods.length-1];
}
function orderId(service, periodLabel){
  const slug=service.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toUpperCase();
  return "PED-"+periodLabel.replace(/\D/g,"").slice(-4)+"-"+slug;
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

</script><script>
let selectedService=null; const period=getCurrentPeriod();
function findOrder(service){const db=loadDB();return db.orders.find(o=>o.service===service&&o.period===period.label);}
document.querySelectorAll(".service-btn").forEach(btn=>btn.onclick=()=>{selectedService=btn.dataset.service;const existing=findOrder(selectedService);if(existing&&existing.status!=="Borrador"){document.getElementById("stepService").classList.add("hidden");document.getElementById("alreadySent").classList.remove("hidden");document.getElementById("sentInfo").innerHTML=`El pedido de <b>${esc(existing.service)}</b> correspondiente a <b>${esc(existing.period)}</b> ya fue enviado.<br><br>Realizado por: <b>${esc(existing.responsible||"—")}</b><br>Fecha/hora: <b>${esc(existing.submittedAt||existing.closedAt||"—")}</b><br>Estado: <b>${esc(existing.status)}</b>`;return;}document.getElementById("stepService").classList.add("hidden");document.getElementById("stepName").classList.remove("hidden");document.getElementById("selectedServiceTitle").textContent=selectedService;});
document.getElementById("backService").onclick=()=>{document.getElementById("stepName").classList.add("hidden");document.getElementById("stepService").classList.remove("hidden");document.getElementById("requesterName").value="";selectedService=null;};
document.getElementById("continueBtn").onclick=()=>{const name=document.getElementById("requesterName").value.trim();if(!name){document.getElementById("nameMsg").innerHTML='<div class="alert danger">Ingrese el nombre de quien realiza el pedido.</div>';return;}sessionStorage.setItem("pedido_request_context",JSON.stringify({service:selectedService,name,period:period.label}));location.href="pedido.html";};
</script></body></html>
