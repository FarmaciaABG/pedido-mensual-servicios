<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solicitar pedido</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#dfe5ee;
  --brand:#1f5b8f;--brand2:#0f416d;--soft:#eaf3fb;--ok:#e8f7ec;
  --warn:#fff4d6;--warnb:#d7a51b;--danger:#fde8e8;--dangerb:#d64545
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--brand2),var(--brand));color:white;padding:22px 28px}
header h1{margin:0;font-size:24px}header p{margin:5px 0 0;font-size:13px;opacity:.9}
.shell{max-width:980px;margin:auto;padding:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 2px 12px rgba(24,39,75,.06)}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid #cfd7e3;border-radius:10px;background:white}
button,.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:white;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.secondary{background:#eef2f7;color:#25344f}
.alert{padding:14px 16px;border-radius:12px;margin-top:16px;font-size:14px}
.alert.info{background:var(--soft);border-left:4px solid var(--brand)}
.alert.warn{background:var(--warn);border-left:4px solid var(--warnb)}
.alert.danger{background:var(--danger);border-left:4px solid var(--dangerb)}
.alert.ok{background:var(--ok)}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:700px){.grid{grid-template-columns:1fr}.shell{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>Pedido mensual de servicios</h1>
  <p>Solicitud de insumos a Farmacia</p>
</header>

<div class="shell">
  <div class="card">
    <h2>Solicitar pedido</h2>
    <p class="small">Seleccione su servicio e identifique a la persona que realiza la solicitud.</p>

    <div class="grid">
      <div>
        <label for="service">Servicio</label>
        <select id="service">
          <option value="">Seleccione un servicio…</option>
        </select>
      </div>
      <div>
        <label for="period">Periodo</label>
        <select id="period"></select>
      </div>
      <div style="grid-column:1/-1">
        <label for="name">Nombre de quien realiza el pedido</label>
        <input id="name" autocomplete="name" placeholder="Nombre y apellido">
      </div>
    </div>

    <div id="message"></div>

    <div class="actions">
      <a class="btn secondary" href="index.html">Volver</a>
      <button id="continueBtn">Continuar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qomszvnpuhtlnrykcyxb.supabase.co";
const SUPABASE_KEY="sb_publishable_zhMUi-mweEAwW1Wpr4N6Dw_PGv8QNTN";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function todayISO(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

let services=[], periods=[];

function getCurrentPeriod(){
  const active=periods.filter(p=>p.active!==false).slice().sort((a,b)=>(a.year-b.year)||(a.month-b.month));
  if(!active.length) return null;
  const today=todayISO();
  const opened=active.filter(p=>p.open_date<=today);
  return opened.length ? opened[opened.length-1] : active[0];
}

async function init(){
  const [sRes,pRes]=await Promise.all([
    sb.from("services").select("id,name,active").eq("active",true).order("name"),
    sb.from("periods").select("*").eq("active",true).order("year").order("month")
  ]);

  if(sRes.error || pRes.error){
    document.getElementById("message").innerHTML='<div class="alert danger">No fue posible cargar la configuración del sistema.</div>';
    document.getElementById("continueBtn").disabled=true;
    return;
  }

  services=sRes.data||[];
  periods=pRes.data||[];

  document.getElementById("service").innerHTML=
    '<option value="">Seleccione un servicio…</option>'+
    services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");

  document.getElementById("period").innerHTML=
    periods.map(p=>`<option value="${p.id}">${esc(p.label)}</option>`).join("");

  const current=getCurrentPeriod();
  if(current) document.getElementById("period").value=String(current.id);
}

async function continueFlow(){
  const serviceId=Number(document.getElementById("service").value||0);
  const periodId=Number(document.getElementById("period").value||0);
  const name=document.getElementById("name").value.trim();
  const message=document.getElementById("message");
  const btn=document.getElementById("continueBtn");

  message.innerHTML="";

  if(!serviceId || !periodId || name.length<2){
    message.innerHTML='<div class="alert danger">Seleccione el servicio, el periodo e ingrese el nombre de quien realiza el pedido.</div>';
    return;
  }

  const service=services.find(s=>Number(s.id)===serviceId);
  const period=periods.find(p=>Number(p.id)===periodId);
  if(!service || !period) return;

  btn.disabled=true;

  const {data,error}=await sb.rpc("get_order_status",{
    p_service_id:serviceId,
    p_period_id:periodId
  });

  btn.disabled=false;

  if(error){
    message.innerHTML='<div class="alert danger">No fue posible verificar si el servicio ya tiene un pedido: '+esc(error.message)+'</div>';
    return;
  }

  const ctx={service,period,name};
  const existing=(data||[])[0]||null;

  if(!existing){
    sessionStorage.setItem("pedido_request_context",JSON.stringify(ctx));
    location.href="pedido.html";
    return;
  }

  if(existing.status==="Enviado"){
    sessionStorage.setItem("pedido_complement_context",JSON.stringify(ctx));
    message.innerHTML=`
      <div class="alert warn">
        <b>Este servicio ya hizo un pedido para ${esc(period.label)}.</b><br>
        ¿Se olvidó de solicitar algo? Mientras Farmacia no haya iniciado la revisión, puede agregar más insumos o aumentar una cantidad del mismo pedido.
        <div class="actions" style="margin-top:12px;justify-content:flex-start">
          <button id="yesComplement">Sí, agregar más cosas</button>
          <button class="secondary" id="noComplement">No, volver</button>
        </div>
      </div>`;
    document.getElementById("yesComplement").onclick=()=>location.href="complementar.html";
    document.getElementById("noComplement").onclick=()=>{message.innerHTML="";};
    return;
  }

  if(existing.status==="En revisión"){
    message.innerHTML=`
      <div class="alert info">
        <b>Este servicio ya hizo su pedido para ${esc(period.label)} y Farmacia ya inició la revisión.</b><br>
        Ya no es posible agregar productos desde el servicio. Si faltó algo, comuníquese con Farmacia.
      </div>`;
    return;
  }

  if(existing.status==="Entrega parcial"){
    message.innerHTML=`
      <div class="alert info">
        <b>Este pedido ya tiene una entrega parcial registrada.</b><br>
        No puede ser complementado desde el servicio.
      </div>`;
    return;
  }

  if(existing.status==="Cerrado"){
    message.innerHTML=`
      <div class="alert ok">
        <b>El pedido de ${esc(period.label)} ya se encuentra cerrado.</b><br>
        Si necesita solicitar algo adicional, comuníquese con Farmacia.
      </div>`;
    return;
  }

  message.innerHTML=`<div class="alert info">Este servicio ya tiene un pedido registrado con estado <b>${esc(existing.status)}</b>.</div>`;
}

document.getElementById("continueBtn").onclick=continueFlow;
document.getElementById("name").addEventListener("keydown",e=>{if(e.key==="Enter")continueFlow();});
init();
</script>
</body>
</html>
